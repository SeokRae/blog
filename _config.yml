# SITE CONFIGURATION
title: SeokRae
url: "https://seokrae.github.io"
baseurl: "/blog"
lang: ko
timezone: Asia/Seoul

remote_theme: rohanchandra/type-theme@c6ec5a69ff7dfe2df193be08515193c72bd4a55d

# THEME-SPECIFIC CONFIGURATION (Type Theme)
theme_settings:
  # Meta
  title: SeokRae
  avatar:
  favicon: assets/favicon.ico
  gravatar:
  description: "경험에서 얻은 인사이트를 기록하는 기술 블로그입니다. 단순 튜토리얼이 아니라 \"왜 그런 선택을 했는지\", \"무엇을 배웠는지\"에 초점을 둡니다."

  # Header and footer text
  header_text:
  header_text_feature_image:
  footer_text: >
    Powered by <a href="https://jekyllrb.com/">Jekyll</a> with <a href="https://github.com/rohanchandra/type-theme">Type Theme</a>

  # Icons
  rss: true
  email_address:
  github: "SeokRae"

  # Scripts
  google_analytics:
  disqus_shortname:
  katex: false
  search: true

  # Localization strings (기본값 유지)
  str_follow_on: "Follow on"
  str_rss_follow: "Follow RSS feed"
  str_email: "Email"
  str_next_post: "Next post"
  str_previous_post: "Previous post"
  str_next_page: "Next"
  str_previous_page: "Prev"
  str_continue_reading: "Continue reading"
  str_javascript_required_disqus: "Please enable JavaScript to view comments."
  str_search_no_results: "No results found."

  # Post navigation
  post_navigation: true

# PAGINATION
paginate: 5
paginate_path: "/page:num/"

# BUILD SETTINGS
markdown: kramdown
highlighter: rouge
sass:
  sass_dir: _sass
  style: compressed
plugins:
  - jekyll-remote-theme
  - jekyll-paginate
  - jekyll-feed
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - LICENSE
  - CLAUDE.md
  - test
